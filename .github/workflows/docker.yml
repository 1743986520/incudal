name: Docker Manual Build

on:
  # Release tag 镜像只由 release.yml 发布，避免覆盖多架构 manifest。
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker-only tag（edge 或 manual-*；不能使用 latest/v*）'
        required: true
        default: 'edge'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-manual-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate Docker-only tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^(edge|manual-[A-Za-z0-9][A-Za-z0-9._-]{0,63})$ ]]; then
            echo "tag must be edge or manual-*; release/latest tags are published by release.yml" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          
