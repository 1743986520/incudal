# ============================================================================
# Incudal prebuilt release artifacts (amd64 + arm64)
# ============================================================================
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag vMAJOR.MINOR.PATCH[-prerelease]; empty builds preview artifacts only'
        required: false
        default: ''

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      image_version: ${{ steps.version.outputs.image_version }}
      image_minor: ${{ steps.version.outputs.image_minor }}
      image_major: ${{ steps.version.outputs.image_major }}
      is_stable: ${{ steps.version.outputs.is_stable }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Validate and resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=''
          publish=false
          if [[ "$EVENT_NAME" == push ]]; then
            version="$REF_NAME"
            publish=true
          elif [[ -n "$INPUT_TAG" ]]; then
            version="$INPUT_TAG"
            publish=true
          else
            version="preview-${GIT_SHA:0:7}"
          fi

          if [[ "$publish" == true ]]; then
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo 'invalid release tag; expected vMAJOR.MINOR.PATCH[-prerelease]' >&2
              exit 1
            fi
          elif [[ ! "$version" =~ ^preview-[0-9a-f]{7}$ ]]; then
            echo 'invalid preview version' >&2
            exit 1
          fi

          image_version="${version#v}"
          image_major=''
          image_minor=''
          is_stable=false
          is_prerelease=false
          if [[ "$publish" == true ]]; then
            IFS='.' read -r major minor patch_with_suffix <<< "$image_version"
            if [[ "$image_version" == *-* ]]; then
              is_prerelease=true
            else
              is_stable=true
              image_major="$major"
              image_minor="${major}.${minor}"
            fi
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "image_version=$image_version"
            echo "image_minor=$image_minor"
            echo "image_major=$image_major"
            echo "is_stable=$is_stable"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild esbuild
        run: pnpm rebuild esbuild
      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Build frontend
        run: pnpm --filter client build
      - name: Build backend
        run: pnpm --filter server build
      - name: Prepare release directory
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/client/dist release/scripts
          # deploy uses the workspace lockfile and includes Prisma CLI (currently a devDependency).
          pnpm --filter server deploy --frozen-lockfile --ignore-scripts release/server
          rm -rf release/server/dist release/server/prisma release/server/templates release/server/prisma.config.ts
          cp -r client/dist/. release/client/dist/
          cp -r server/dist release/server/
          cp -r server/prisma release/server/
          cp server/prisma.config.ts release/server/
          cp -r server/templates release/server/
          cp scripts/install-docker.sh scripts/install-panel.sh scripts/remote-update.sh release/scripts/
          cp package.json release/
          printf '%s\n' "$RELEASE_VERSION" > release/VERSION
          test -x release/server/node_modules/.bin/prisma
          test -f release/scripts/remote-update.sh
      - name: Verify runtime CLI and generate client
        working-directory: release/server
        run: |
          set -euo pipefail
          test -x node_modules/.bin/prisma
          DATABASE_URL='postgresql://user:pass@localhost:5432/db' ./node_modules/.bin/prisma generate
      - name: Create management script
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > release/VERSION
          cat > release/incudal.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          APP_DIR="$(cd "$(dirname "$0")" && pwd)"
          PRISMA_CLI="$APP_DIR/server/node_modules/.bin/prisma"
          [[ -x "$PRISMA_CLI" ]] || { echo "missing bundled Prisma CLI" >&2; exit 1; }
          case "${1:-}" in
            start) cd "$APP_DIR/server"; "$PRISMA_CLI" migrate deploy; exec node "$APP_DIR/server/dist/app.js" ;;
            migrate) cd "$APP_DIR/server"; "$PRISMA_CLI" migrate deploy ;;
            version) echo "Incudal $(cat "$APP_DIR/VERSION")" ;;
            *) echo "usage: $0 {start|migrate|version}" >&2; exit 1 ;;
          esac
          SCRIPT
          chmod +x release/incudal.sh
      - name: Package and checksum
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="incudal-${RELEASE_VERSION}-linux-${ARCH}.tar.gz"
          (cd release && tar -czf "../${archive}" .)
          sha256sum "$archive" > "${archive}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: incudal-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            incudal-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            incudal-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 30

  release:
    name: Publish Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: incudal-${{ needs.prepare.outputs.version }}-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: incudal-${{ needs.prepare.outputs.version }}-linux-arm64
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            incudal-*.tar.gz
            incudal-*.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}

  docker:
    name: Publish multi-arch Docker image
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_version }}
            type=raw,value=${{ needs.prepare.outputs.image_minor }},enable=${{ needs.prepare.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.image_major }},enable=${{ needs.prepare.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_stable == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
